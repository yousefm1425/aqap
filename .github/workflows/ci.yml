name: اختبارات AQAP
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: aqap, POSTGRES_PASSWORD: aqap, POSTGRES_DB: aqap }
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd "pg_isready -U aqap" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: الاختبارات (اختبارات القالب الرسمي تُتخطى لأن الملف لا يُرفع للمستودع)
        env:
          AQAP_TEST_ADMIN_URL: postgresql://aqap:aqap@localhost:5432/postgres
        run: pytest -q

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: aqap
      POSTGRES_PASSWORD: aqap
      POSTGRES_DB: aqap
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aqap"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: aqap
      MINIO_ROOT_PASSWORD: change-me-minio
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  api:
    build: .
    env_file: .env
    volumes:
      - ./templates:/srv/templates:ro      # ضع هنا ملف نموذج العمل الرسمي (.xlsb)
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    ports:
      - "8000:8000"

volumes:
  pgdata:
  miniodata:
